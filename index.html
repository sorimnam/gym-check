<title>건강하게 살자</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="건강하게 살자">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232F6B4F'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%92%AA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#EEF1EC;
    --surface:#FFFFFF;
    --surface-2:#E4E9E1;
    --text:#16211A;
    --text-muted:#5C6B5F;
    --border:#D7DFD3;
    --accent:#2F6B4F;
    --accent-strong:#215038;
    --accent-soft:#DCEBE2;
    --gold:#C68A1E;
    --gold-soft:#F6E6C4;
    --silver:#7C8A85;
    --silver-soft:#E7ECE9;
    --bronze:#A5622F;
    --bronze-soft:#F0DECB;
    --shadow: 0 1px 2px rgba(22,33,26,0.06), 0 8px 24px -12px rgba(22,33,26,0.18);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1811;
      --surface:#17221A;
      --surface-2:#1D2A21;
      --text:#EDF1EA;
      --text-muted:#96A79A;
      --border:#26362B;
      --accent:#57A97B;
      --accent-strong:#7CC79A;
      --accent-soft:#1D3327;
      --gold:#E8B54F;
      --gold-soft:#2E2612;
      --silver:#AAB8B1;
      --silver-soft:#232D28;
      --bronze:#D08C57;
      --bronze-soft:#2E2016;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 28px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1811;
    --surface:#17221A;
    --surface-2:#1D2A21;
    --text:#EDF1EA;
    --text-muted:#96A79A;
    --border:#26362B;
    --accent:#57A97B;
    --accent-strong:#7CC79A;
    --accent-soft:#1D3327;
    --gold:#E8B54F;
    --gold-soft:#2E2612;
    --silver:#AAB8B1;
    --silver-soft:#232D28;
    --bronze:#D08C57;
    --bronze-soft:#2E2016;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 28px -14px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overflow-x:hidden; max-width:100%; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Work Sans", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:40px;
  }
  h1,h2,h3{
    font-family:"Big Shoulders Display", "Work Sans", sans-serif;
    text-wrap:balance;
    margin:0;
  }
  .mono{ font-family:"JetBrains Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  button:focus-visible, input:focus-visible, a:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  ::selection{ background:var(--accent-soft); }

  /* ---------- header ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    padding:32px 20px 12px;
    padding-top:calc(env(safe-area-inset-top, 0px) + 32px);
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:10px;
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .eyebrow{
    font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent);
  }
  .brand h1{ font-size:26px; font-weight:800; line-height:1; color:var(--text); }
  .whoami{
    display:flex; align-items:center; gap:8px;
    font-size:13px; color:var(--text-muted);
    background:none; border:none; padding:4px; cursor:pointer;
    border-radius:10px;
  }
  .whoami:hover{ background:var(--surface-2); }
  .avatar{
    width:30px; height:30px; border-radius:50%;
    background:var(--accent-soft); color:var(--accent-strong);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; flex-shrink:0;
  }

  .local-banner{
    margin:12px 20px 0; padding:10px 14px; border-radius:12px;
    background:var(--gold-soft); color:var(--bronze);
    font-size:12.5px; line-height:1.5; border:1px solid var(--gold);
  }

  .header-actions{ display:flex; align-items:center; gap:4px; }
  .icon-btn{
    width:34px; height:34px; border-radius:10px; border:none; background:none;
    color:var(--text-muted); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; flex-shrink:0;
  }
  .icon-btn:hover{ background:var(--surface-2); }

  .cleanup-note{ font-size:13px; color:var(--text-muted); line-height:1.6; }
  .cleanup-date{
    padding:12px 14px; border-radius:12px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--text); font-size:15px; width:100%;
  }
  .cleanup-preview{ font-size:13px; color:var(--accent-strong); font-weight:700; }

  /* ---------- CTA ---------- */
  .cta-wrap{ padding:16px 20px 4px; }
  .cta{
    width:100%; border:none; border-radius:20px;
    padding:18px 20px; cursor:pointer;
    background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-size:17px; font-weight:700;
    box-shadow:var(--shadow);
    transition:transform .15s ease, background .15s ease;
  }
  .cta:active{ transform:scale(0.98); }
  .cta.done-today{
    background:var(--surface); color:var(--accent-strong);
    border:1.5px solid var(--accent);
    opacity:0.9;
  }
  .cta:disabled{ cursor:default; }
  .cta svg{ width:20px; height:20px; flex-shrink:0; }
  .cta-note{ text-align:center; font-size:12px; color:var(--text-muted); margin:8px 0 0; }

  /* ---------- tabs ---------- */
  .tabs{
    display:flex; gap:6px; margin:18px 20px 8px;
    background:var(--surface-2); padding:4px; border-radius:14px;
  }
  .tab{
    flex:1; text-align:center; padding:9px 8px; border-radius:11px;
    border:none; background:transparent; color:var(--text-muted);
    font-size:14px; font-weight:600; cursor:pointer;
  }
  .tab.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow); }

  section.view{ padding:4px 20px 24px; display:flex; flex-direction:column; gap:10px; min-width:0; }

  /* ---------- leaderboard ---------- */
  .board-meta{
    display:flex; justify-content:space-between; align-items:baseline;
    margin:8px 2px 2px; color:var(--text-muted); font-size:12.5px;
  }
  .board-hint{
    text-align:center; color:var(--text-muted); font-size:11.5px;
    margin:6px 2px 0;
  }
  .row{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:12px 14px;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
    touch-action:pan-y;
  }
  .row.me{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .rank{
    width:34px; height:34px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:"Big Shoulders Display", sans-serif; font-weight:800; font-size:16px;
    background:var(--surface-2); color:var(--text-muted);
  }
  .rank.r1{ background:var(--gold-soft); color:var(--gold); }
  .rank.r2{ background:var(--silver-soft); color:var(--silver); }
  .rank.r3{ background:var(--bronze-soft); color:var(--bronze); }
  .row-main{ flex:1; min-width:0; }
  .row-name{ font-weight:700; font-size:15px; display:flex; align-items:center; gap:6px; }
  .row-name .you-tag{
    font-size:10.5px; font-weight:700; color:var(--accent-strong);
    background:var(--accent-soft); padding:1px 6px; border-radius:6px;
  }
  .bar-track{
    margin-top:6px; height:6px; border-radius:4px; background:var(--surface-2); overflow:hidden;
  }
  .bar-fill{ height:100%; background:var(--accent); border-radius:4px; }
  .row.r1 .bar-fill{ background:var(--gold); }
  .row.r2 .bar-fill{ background:var(--silver); }
  .row.r3 .bar-fill{ background:var(--bronze); }
  .count{
    font-family:"JetBrains Mono", monospace; font-variant-numeric:tabular-nums;
    font-weight:600; font-size:15px; color:var(--text); flex-shrink:0;
  }
  .count small{ font-size:11px; color:var(--text-muted); font-weight:500; }

  .empty{
    text-align:center; padding:36px 16px; color:var(--text-muted); font-size:14px;
    background:var(--surface); border:1px dashed var(--border); border-radius:16px;
  }

  /* ---------- meal tracking ---------- */
  .meal-card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:10px;
    min-width:0;
  }
  .meal-member-name{ font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:6px; }
  .meal-slots{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
  .meal-slot{ display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; }
  .meal-slot-photo{
    width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px;
    background:var(--surface-2); cursor:zoom-in; display:block; border:1px solid var(--border);
  }
  .meal-slot-empty{
    width:100%; aspect-ratio:1/1; border-radius:12px;
    border:1.5px dashed var(--border); background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-muted); font-size:20px; font-weight:600;
    cursor:pointer;
  }
  .meal-slot-empty.locked{ cursor:default; opacity:0.5; }
  .meal-slot-label{ font-size:10.5px; color:var(--text-muted); font-weight:600; text-align:center; }
  .meal-slot-text{
    width:100%; aspect-ratio:1/1; border-radius:12px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:10px; font-weight:600;
    padding:6px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical;
    line-height:1.3; text-align:center;
  }
  .meal-text-input{
    width:100%; min-height:90px; padding:12px 14px; border-radius:14px;
    border:1.5px solid var(--border); background:var(--surface); color:var(--text);
    font-size:14px; font-family:inherit; resize:vertical;
  }
  .meal-text-input:focus{ border-color:var(--accent); }

  /* ---------- meal calendar ---------- */
  .meal-cal{ display:flex; flex-direction:column; gap:10px; min-width:0; }
  .meal-cal-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:2px 4px;
  }
  .meal-cal-month{
    font-family:"Big Shoulders Display", sans-serif; font-weight:800; font-size:18px;
  }
  .meal-cal-nav{
    width:32px; height:32px; border-radius:10px; border:none; background:var(--surface-2);
    color:var(--text); font-size:18px; cursor:pointer;
  }
  .meal-cal-grid{
    display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; width:100%;
  }
  .meal-cal-weekdays{ margin-bottom:-2px; }
  .meal-cal-weekday{
    min-width:0; text-align:center; font-size:11px; color:var(--text-muted); font-weight:600; padding:4px 0;
  }
  .meal-cal-cell{
    min-width:0; aspect-ratio:1/1; border-radius:12px; background:var(--surface);
    border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; cursor:pointer; color:var(--text); font-size:13px; font-weight:600; padding:0;
  }
  .meal-cal-cell.empty{ visibility:hidden; cursor:default; border:none; background:none; }
  .meal-cal-cell.today{ border-color:var(--accent); color:var(--accent-strong); }
  .meal-cal-dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); }
  .meal-cal-cell.has-data .meal-cal-daynum{ color:var(--accent-strong); }

  .meal-day-bar{ display:flex; align-items:center; gap:10px; padding:2px 2px 4px; }
  .meal-back-btn{
    border:none; background:var(--surface-2); color:var(--text);
    padding:6px 12px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .meal-day-label{
    font-family:"Big Shoulders Display", sans-serif; font-weight:800; font-size:18px;
  }

  /* ---------- feed (photos by day) ---------- */
  .feed-day{ display:flex; flex-direction:column; gap:8px; }
  .feed-day-label{
    font-family:"Big Shoulders Display", sans-serif; font-weight:800; font-size:18px;
    padding:6px 2px 0;
  }
  .feed-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .feed-item{ display:flex; flex-direction:column; gap:6px; }
  .feed-photo{
    width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:14px;
    background:var(--surface-2); cursor:zoom-in; display:block; border:1px solid var(--border);
  }
  .feed-caption{ display:flex; justify-content:space-between; align-items:baseline; gap:6px; padding:0 2px; }
  .feed-name{ font-weight:700; font-size:12.5px; }
  .feed-time{ font-size:10.5px; color:var(--text-muted); flex-shrink:0; }

  /* ---------- onboarding ---------- */
  .onboard{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:32px 24px 60px; gap:22px; }
  .onboard-hero{ text-align:center; display:flex; flex-direction:column; gap:8px; }
  .onboard-hero .eyebrow{ font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  .onboard-hero h1{ font-size:32px; font-weight:800; }
  .onboard-hero p{ color:var(--text-muted); font-size:14px; margin:0; }
  .name-grid{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .name-chip{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    padding:10px 16px; border-radius:999px; font-size:14.5px; font-weight:600; cursor:pointer;
  }
  .name-chip:active{ background:var(--surface-2); }
  .divider{ display:flex; align-items:center; gap:10px; color:var(--text-muted); font-size:12px; }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background:var(--border); }
  .join-form{ display:flex; flex-direction:column; gap:10px; }
  .join-form input{
    padding:14px 16px; border-radius:14px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--text); font-size:15px;
  }
  .join-form input:focus{ border-color:var(--accent); }
  .join-form button{
    padding:14px 16px; border-radius:14px; border:none; background:var(--accent);
    color:#fff; font-weight:700; font-size:15px; cursor:pointer;
  }
  .join-error{ color:#B4483C; font-size:12.5px; }
  .full-note{ text-align:center; color:var(--text-muted); font-size:13px; }

  /* ---------- overlays ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,14,11,0.62);
    display:flex; align-items:flex-end; justify-content:center; z-index:100;
    backdrop-filter:blur(2px);
  }
  .overlay.center{ align-items:center; padding:24px; }
  .sheet{
    width:100%; max-width:480px; background:var(--surface);
    border-radius:22px 22px 0 0; padding:22px 22px 28px;
    display:flex; flex-direction:column; gap:14px;
    box-shadow:var(--shadow);
  }
  .sheet h3{ font-size:19px; font-weight:800; }
  .sheet-photo{ width:100%; max-height:320px; object-fit:cover; border-radius:14px; background:var(--surface-2); }
  .sheet-actions{ display:flex; gap:10px; }
  .btn{
    flex:1; padding:13px; border-radius:13px; border:none; font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .btn.primary{ background:var(--accent); color:#fff; }
  .btn.ghost{ background:var(--surface-2); color:var(--text); }
  .btn.danger{ background:#B4483C; color:#fff; }
  .lightbox-img{ max-width:100%; max-height:80vh; border-radius:12px; }
  .lightbox-close{
    position:absolute; top:18px; right:18px; width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,0.15); color:#fff; border:none; font-size:18px; cursor:pointer;
    z-index:1;
  }
  .comment-list{
    display:flex; flex-direction:column; gap:6px;
    overflow-y:auto; max-height:18vh;
    padding-top:4px; border-top:1px solid var(--border);
  }
  .comment-item{ display:flex; gap:6px; font-size:13px; line-height:1.4; }
  .comment-author{ font-weight:700; flex-shrink:0; }
  .comment-text{ color:var(--text); word-break:break-word; }
  .comment-empty{ color:var(--text-muted); font-size:12px; text-align:center; padding:4px 0; }
  .comment-form{ display:flex; gap:8px; }
  .comment-input{
    flex:1; min-width:0; padding:10px 14px; border-radius:999px; border:1.5px solid var(--border);
    background:var(--bg); color:var(--text); font-size:14px;
  }
  .comment-input:focus{ border-color:var(--accent); }
  .comment-submit{
    width:40px; height:40px; border-radius:50%; border:none; background:var(--accent);
    color:#fff; font-size:16px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .spinner{
    width:16px; height:16px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
    animation:spin .7s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .spinner{ animation:none; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .visually-hidden{
    position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);
  }
</style>
</head>

  function firstOfMonthStr(){
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,"0");
    return y + "-" + m + "-01";
  }

  function monthKeyOf(ts){
    var d = new Date(ts);
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  }

  function monthLabel(key){
    var parts = key.split("-");
    return parts[0] + "년 " + parseInt(parts[1], 10) + "월";
  }

  function currentMonthLabel(){
    return monthLabel(monthKeyOf(Date.now()));
  }

  // Days in the calendar month named by a "YYYY-MM" key — the natural cap on
  // a leaderboard count once check-ins are limited to one per day.
  function daysInMonthKey(key){
    var parts = key.split("-");
    var y = parseInt(parts[0], 10);
    var m = parseInt(parts[1], 10);
    return new Date(y, m, 0).getDate();
  }

  function shiftMonthKey(key, delta){
    var parts = key.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1 + delta, 1);
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  }

  function dayKeyOf(ts){
    var d = new Date(ts);
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  function dayLabel(key){
    var parts = key.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    var today = new Date();
    var yesterday = new Date(); yesterday.setDate(today.getDate()-1);
    function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
    if (sameDay(d, today)) return "오늘";
    if (sameDay(d, yesterday)) return "어제";
    return (d.getMonth()+1) + "월 " + d.getDate() + "일";
  }

  function timeOfDay(ts){
    var d = new Date(ts);
    var h = d.getHours(), min = d.getMinutes();
    var ampm = h < 12 ? "오전" : "오후";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return ampm + " " + h12 + ":" + String(min).padStart(2,"0");
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function initials(name){
    var n = (name || "").trim();
    return n ? n.slice(0,1).toUpperCase() : "?";
  }

  function isToday(ts){
    var a = new Date(ts), b = new Date();
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }

  /* ---------------- data layer (Firebase Firestore, with local fallback) ---------------- */

  function initDataLayer(){
    return new Promise(function(resolve){
      try {
        if (typeof firebase === "undefined" || !firebase.firestore) throw new Error("firebase sdk not loaded");
        if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        var db = firebase.firestore();
        state.isShared = true;

        db.collection("members").onSnapshot(function(snap){
          state.members = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
          syncCurrentUser();
          render();
        }, function(){ /* degrade silently; UI keeps last known state */ });

        db.collection("checkins").orderBy("createdAt","desc").onSnapshot(function(snap){
          state.checkins = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
          render();
        }, function(){});

        db.collection("meals").onSnapshot(function(snap){
          state.meals = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
          render();
        }, function(){});

        db.collection("mealComments").orderBy("createdAt","asc").onSnapshot(function(snap){
          state.mealComments = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
          render();
        }, function(){});

        resolve({
          addMember: function(name){
            return db.collection("members").add({ name: name, joinedAt: Date.now() }).then(function(ref){ return ref.id; });
          },
          checkIn: function(memberId, name, photo){
            return db.collection("checkins").add({ memberId: memberId, name: name, photo: photo, createdAt: Date.now() });
          },
          // Deletes photo records older than beforeTs. The cleanup UI caps the date
          // at the start of the current month, so this-month standings are safe too.
          deleteCheckinsBefore: function(beforeTs){
            var toDelete = state.checkins.filter(function(c){ return c.createdAt < beforeTs; });
            return Promise.all(toDelete.map(function(c){ return db.collection("checkins").doc(c.id).delete(); }))
              .then(function(){ return toDelete.length; });
          },
          // One meal entry per member/day/slot — a deterministic doc id means
          // uploading again for the same slot just overwrites it. entry is
          // { kind: "photo", photo } or { kind: "text", text }.
          addMeal: function(memberId, name, slot, dayKey, entry){
            var id = memberId + "_" + dayKey + "_" + slot;
            var doc = { memberId: memberId, name: name, slot: slot, dayKey: dayKey, kind: entry.kind, createdAt: Date.now() };
            if (entry.kind === "text") doc.text = entry.text; else doc.photo = entry.photo;
            return db.collection("meals").doc(id).set(doc);
          },
          // A comment thread per member/day (entryId = memberId_dayKey), shown
          // below that person's four meal slots for the day.
          addComment: function(entryId, authorId, authorName, text){
            return db.collection("mealComments").add({ entryId: entryId, authorId: authorId, authorName: authorName, text: text, createdAt: Date.now() });
          },
          // Removes someone from the active roster only. Their past checkins,
          // photos, and meal records are untouched.
          deleteMember: function(memberId){
            return db.collection("members").doc(memberId).delete();
          }
        });
      } catch (e){
        resolve(initLocalFallback());
      }
    });
  }

  function initLocalFallback(){
    // Used only if the Firebase SDK fails to load (offline, blocked, bad config).
    // Not synced with other family members — this device only, for this visit.
    state.isShared = false;
    var mem = { members: [], checkins: [], meals: [], mealComments: [] };
    function pushMembers(){ state.members = mem.members.slice(); syncCurrentUser(); render(); }
    function pushCheckins(){ state.checkins = mem.checkins.slice().sort(function(a,b){ return b.createdAt - a.createdAt; }); render(); }
    function pushMeals(){ state.meals = mem.meals.slice(); render(); }
    function pushComments(){ state.mealComments = mem.mealComments.slice().sort(function(a,b){ return a.createdAt - b.createdAt; }); render(); }
    pushMembers(); pushCheckins(); pushMeals(); pushComments();
    return {
      addMember: function(name){
        var id = "local-" + Math.random().toString(36).slice(2,9);
        mem.members.push({ id: id, name: name, joinedAt: Date.now() });
        pushMembers();
        return Promise.resolve(id);
      },
      checkIn: function(memberId, name, photo){
        mem.checkins.push({ id:"c-"+Math.random().toString(36).slice(2,9), memberId: memberId, name: name, photo: photo, createdAt: Date.now() });
        pushCheckins();
        return Promise.resolve();
      },
      deleteCheckinsBefore: function(beforeTs){
        var before = mem.checkins.length;
        mem.checkins = mem.checkins.filter(function(c){ return !(c.createdAt < beforeTs); });
        pushCheckins();
        return Promise.resolve(before - mem.checkins.length);
      },
      addMeal: function(memberId, name, slot, dayKey, entry){
        var id = memberId + "_" + dayKey + "_" + slot;
        var idx = -1;
        mem.meals.forEach(function(m, i){ if (m.id === id) idx = i; });
        var doc = { id: id, memberId: memberId, name: name, slot: slot, dayKey: dayKey, kind: entry.kind, createdAt: Date.now() };
        if (entry.kind === "text") doc.text = entry.text; else doc.photo = entry.photo;
        if (idx === -1) mem.meals.push(doc); else mem.meals[idx] = doc;
        pushMeals();
        return Promise.resolve();
      },
      addComment: function(entryId, authorId, authorName, text){
        mem.mealComments.push({ id: "cm-" + Math.random().toString(36).slice(2,9), entryId: entryId, authorId: authorId, authorName: authorName, text: text, createdAt: Date.now() });
        pushComments();
        return Promise.resolve();
      },
      deleteMember: function(memberId){
        mem.members = mem.members.filter(function(m){ return m.id !== memberId; });
        pushMembers();
        return Promise.resolve();
      }
    };
  }

  function syncCurrentUser(){
    var saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch(e){}
    if (saved){
      var found = state.members.filter(function(m){ return m.id === saved; })[0];
      state.currentUser = found || null;
    } else {
      state.currentUser = null;
    }
  }

  /* ---------------- image capture + compression ---------------- */

  function fileToDataUrl(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function loadImage(src){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = reject;
      img.src = src;
    });
  }

  function compressImage(file){
    return fileToDataUrl(file).then(loadImage).then(function(img){
      var maxDim = 1000;
      var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width * scale));
      var h = Math.max(1, Math.round(img.height * scale));
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      var qualities = [0.75, 0.6, 0.45, 0.3, 0.2];
      var out = canvas.toDataURL("image/jpeg", qualities[0]);
      for (var i=1; i<qualities.length && out.length > 700000; i++){
        out = canvas.toDataURL("image/jpeg", qualities[i]);
      }
      return out;
    });
  }

  /* ---------------- actions ---------------- */

  function handleJoinExisting(memberId){
    try { localStorage.setItem(STORAGE_KEY, memberId); } catch(e){}

  function handleCreateMember(){
    var name = state.joinName.trim();
    if (!name){ state.joinError = "이름을 입력해주세요."; render(); return; }
    if (state.members.length >= MAX_MEMBERS){ state.joinError = "정원(" + MAX_MEMBERS + "명)이 모두 찼어요."; render(); return; }
    var dup = state.members.some(function(m){ return m.name.trim().toLowerCase() === name.toLowerCase(); });
    if (dup){ state.joinError = "이미 등록된 이름이에요. 위 목록에서 선택해주세요."; render(); return; }
    state.joinError = "";
    state.dataLayer.addMember(name).then(function(id){
      try { localStorage.setItem(STORAGE_KEY, id); } catch(e){}
      syncCurrentUser();
      render();
    });
  }

    try { localStorage.removeItem(STORAGE_KEY); } catch(e){}

    state.tab = "board";
    render();

  // Touch/mouse "press and hold" — used on leaderboard rows to reveal the
  // delete action without cluttering the row with a visible button.
  function bindLongPress(el, onLongPress){
    var LONG_PRESS_MS = 550;
    var MOVE_CANCEL_PX = 12;
    var timer = null, startX = 0, startY = 0;
    function clear(){ if (timer){ clearTimeout(timer); timer = null; } }
    el.addEventListener("pointerdown", function(e){
      startX = e.clientX; startY = e.clientY;
      clear();
      timer = setTimeout(function(){
        timer = null;
        if (navigator.vibrate){ try { navigator.vibrate(15); } catch(err){} }
        onLongPress();
      }, LONG_PRESS_MS);
    });
    el.addEventListener("pointermove", function(e){
      if (!timer) return;
      if (Math.abs(e.clientX - startX) > MOVE_CANCEL_PX || Math.abs(e.clientY - startY) > MOVE_CANCEL_PX) clear();
    });
    el.addEventListener("pointerup", clear);
    el.addEventListener("pointerleave", clear);
    el.addEventListener("pointercancel", clear);
    el.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  }

  function openCleanup(){
    state.cleanup = { date: firstOfMonthStr() };
    render();
  }

    state.cleanup = null;
    render();
  }

  function runCleanup(){
    if (!state.cleanup) return;
    var cutoff = new Date(state.cleanup.date + "T00:00:00").getTime();
    if (isNaN(cutoff)) return;
    var firstOfThisMonth = new Date(firstOfMonthStr() + "T00:00:00").getTime();
    if (cutoff > firstOfThisMonth) cutoff = firstOfThisMonth; // never let cleanup reach into this month
    var count = state.checkins.filter(function(c){ return c.createdAt < cutoff; }).length;
    if (!count){ alert("선택한 날짜 이전 사진이 없어요."); return; }
    if (!confirm(count + "장의 사진을 삭제할까요? 지난 달까지의 사진만 지워져요. 되돌릴 수 없어요.")) return;
    state.cleaning = true;
    render();
    state.dataLayer.deleteCheckinsBefore(cutoff).then(function(deleted){
      state.cleaning = false;
      state.cleanup = null;
      render();
      alert(deleted + "장의 사진을 정리했어요.");
    });
  }

  /* ---------------- render ---------------- */

  function computeLeaderboard(){
    // The leaderboard is this-calendar-month only: it resets automatically at
    // month start because it's counted fresh from this month's checkins each time.
    var currentMonthKey = monthKeyOf(Date.now());
    var counts = {};
    state.checkins.forEach(function(c){
      if (monthKeyOf(c.createdAt) === currentMonthKey) counts[c.memberId] = (counts[c.memberId] || 0) + 1;
    });
    var rows = state.members.map(function(m){
      return { id: m.id, name: m.name, count: counts[m.id] || 0 };
    });
    rows.sort(function(a,b){
      if (b.count !== a.count) return b.count - a.count;
      return a.name.localeCompare(b.name);
    });
    return rows;
  }

    bindMain();
  }

        '<div class="overlay" id="mealConfirmOverlay">' +
          '<div class="sheet">' +
            '<h3>' + escapeHtml(slotInfo.label) + ' 식단을 인증할까요?</h3>' +
            '<img class="sheet-photo" src="' + state.pendingMeal.photo + '" alt="식단 인증 사진 미리보기" />' +
            '<div class="sheet-actions">' +
              '<button class="btn ghost" id="mealCancelBtn">다시 선택</button>' +
              '<button class="btn primary" id="mealConfirmBtn">인증 완료</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }
    if (state.pendingMealChoice){
      var choiceSlotInfo = MEAL_SLOTS.filter(function(s){ return s.key === state.pendingMealChoice.slot; })[0] || { label: "식단" };
      modals += '' +
        '<div class="overlay" id="mealChoiceOverlay">' +
          '<div class="sheet">' +
            '<h3>' + escapeHtml(choiceSlotInfo.label) + ' 인증 방법을 선택하세요</h3>' +
            '<div class="sheet-actions">' +
              '<button class="btn ghost" id="mealChoicePhotoBtn">📷 사진</button>' +
              '<button class="btn ghost" id="mealChoiceTextBtn">✏️ 텍스트</button>' +
            '</div>' +
            '<button class="btn ghost" id="mealChoiceCancelBtn">취소</button>' +
          '</div>' +
        '</div>';
    }
    if (state.pendingMealText){
      var textSlotInfo = MEAL_SLOTS.filter(function(s){ return s.key === state.pendingMealText.slot; })[0] || { label: "식단" };
      modals += '' +
        '<div class="overlay" id="mealTextOverlay">' +
          '<div class="sheet">' +
            '<h3>' + escapeHtml(textSlotInfo.label) + ' 무엇을 드셨나요?</h3>' +
            '<textarea class="meal-text-input" id="mealTextInput" maxlength="120" placeholder="예: 샐러드랑 닭가슴살">' + escapeHtml(state.pendingMealText.text) + '</textarea>' +
            '<div class="sheet-actions">' +
              '<button class="btn ghost" id="mealTextCancelBtn">취소</button>' +
              '<button class="btn primary" id="mealTextConfirmBtn">인증 완료</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }
    if (state.lightbox){
      modals += '' +
        '<div class="overlay center" id="lightboxOverlay" style="position:relative;">' +
          '<button class="lightbox-close" id="lightboxClose" aria-label="닫기">✕</button>' +
          '<img class="lightbox-img" src="' + state.lightbox + '" alt="인증 사진 확대" />' +
        '</div>';
    }
    if (state.cleanup){
      var cutoffTs = new Date(state.cleanup.date + "T00:00:00").getTime();
      var willDelete = isNaN(cutoffTs) ? 0 : state.checkins.filter(function(c){ return c.createdAt < cutoffTs; }).length;
      modals += '' +
        '<div class="overlay" id="cleanupOverlay">' +
          '<div class="sheet">' +
            '<h3>지난 사진 정리</h3>' +
            '<p class="cleanup-note">이번 달 이전(지난 달까지) 인증사진만 정리할 수 있어요. 이번 달 순위에는 영향이 없어요. 삭제 후에는 되돌릴 수 없어요.</p>' +
            '<input type="date" class="cleanup-date" id="cleanupDateInput" max="' + escapeHtml(firstOfMonthStr()) + '" value="' + escapeHtml(state.cleanup.date) + '" />' +
            '<div class="cleanup-preview">' + willDelete + '장이 삭제돼요</div>' +
            '<div class="sheet-actions">' +
              '<button class="btn ghost" id="cleanupCancel">취소</button>' +
              '<button class="btn primary" id="cleanupConfirm" ' + (state.cleaning ? "disabled" : "") + '>' + (state.cleaning ? '삭제 중…' : '삭제하기') + '</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }
    if (state.deleteTarget){
      modals += '' +
        '<div class="overlay" id="deleteMemberOverlay">' +
          '<div class="sheet">' +
            '<h3>' + escapeHtml(state.deleteTarget.name) + '님을 삭제할까요?</h3>' +
            '<p class="cleanup-note">이번 달 리더보드에서만 빠져요. 인증 사진과 식단 기록은 그대로 남아요. 다시 참여하려면 새 이름으로 등록해야 해요.</p>' +
            '<div class="sheet-actions">' +
              '<button class="btn ghost" id="deleteMemberCancel">취소</button>' +
              '<button class="btn danger" id="deleteMemberConfirm">삭제하기</button>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    return sharedNote + header + cta + tabs + '<section class="view">' + body + '</section>' + modals;
  }

  function renderBoard(){
    var rows = computeLeaderboard();
    if (!rows.length) return '<div class="empty">아직 등록된 멤버가 없어요.</div>';
    var totalDays = daysInMonthKey(monthKeyOf(Date.now()));

    var meta = '<div class="board-meta"><span>' + currentMonthLabel() + ' 인증 횟수 기준</span><span>총 ' + rows.length + '명</span></div>';
    var hint = '<div class="board-hint">이름을 길게 누르면 멤버를 삭제할 수 있어요</div>';

    var list = rows.map(function(r, idx){
      var rank = idx + 1;
      var rankClass = rank === 1 ? " r1" : rank === 2 ? " r2" : rank === 3 ? " r3" : "";
      var rowClass = "row" + rankClass + (r.id === state.currentUser.id ? " me" : "");
      var medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : rank;
      var pct = Math.max(4, Math.round((r.count / totalDays) * 100));
      return '' +
        '<div class="' + rowClass + '" data-member-row="' + escapeHtml(r.id) + '" data-member-name="' + escapeHtml(r.name) + '">' +
          '<div class="rank' + rankClass + '">' + medal + '</div>' +
          '<div class="row-main">' +
            '<div class="row-name">' + escapeHtml(r.name) + (r.id === state.currentUser.id ? '<span class="you-tag">나</span>' : '') + '</div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
          '</div>' +
          '<div class="count">' + r.count + '/' + totalDays + '<small> 회</small></div>' +
        '</div>';
    }).join("");

    return meta + list + hint;
  }

  function renderMealTab(){
    if (!state.members.length) return '<div class="empty">아직 등록된 멤버가 없어요.</div>';
    if (state.mealSelectedDay) return renderMealDay(state.mealSelectedDay);
    return renderMealCalendar();
  }

  function renderMealCalendar(){
    var monthKey = state.mealCalendarMonth;
    var totalDays = daysInMonthKey(monthKey);
    var parts = monthKey.split("-").map(Number);
    var firstWeekday = new Date(parts[0], parts[1]-1, 1).getDay();
    var todayKey = dayKeyOf(Date.now());

    var daysWithData = {};
    state.meals.forEach(function(m){ daysWithData[m.dayKey] = true; });

    var header = '' +
      '<div class="meal-cal-header">' +
        '<button class="meal-cal-nav" data-meal-cal-prev aria-label="이전 달">‹</button>' +
        '<span class="meal-cal-month">' + monthLabel(monthKey) + '</span>' +
        '<button class="meal-cal-nav" data-meal-cal-next aria-label="다음 달">›</button>' +
      '</div>';

    var weekdays = ["일","월","화","수","목","금","토"];
    var weekdayRow = '<div class="meal-cal-grid meal-cal-weekdays">' +
      weekdays.map(function(w){ return '<div class="meal-cal-weekday">' + w + '</div>'; }).join("") +
      '</div>';

    var cells = [];
    for (var i=0; i<firstWeekday; i++) cells.push('<div class="meal-cal-cell empty"></div>');
    for (var d=1; d<=totalDays; d++){
      var dayKey = monthKey + "-" + String(d).padStart(2,"0");
      var isToday = dayKey === todayKey;
      var hasData = !!daysWithData[dayKey];
      cells.push(
        '<button class="meal-cal-cell' + (isToday ? ' today' : '') + (hasData ? ' has-data' : '') + '" data-meal-day="' + dayKey + '">' +
          '<span class="meal-cal-daynum">' + d + '</span>' +
          (hasData ? '<span class="meal-cal-dot"></span>' : '') +
        '</button>'
      );
    }
    var grid = '<div class="meal-cal-grid">' + cells.join("") + '</div>';

    return '<div class="meal-cal">' + header + weekdayRow + grid + '</div>';
  }

  function renderMealDay(dayKey){
    var map = {};
    state.meals.forEach(function(m){ if (m.dayKey === dayKey) map[m.memberId + "|" + m.slot] = m; });

    var isTodaySelected = dayKey === dayKeyOf(Date.now());
    var backBar = '' +
      '<div class="meal-day-bar">' +
        '<button class="meal-back-btn" data-meal-back>‹ 달력</button>' +
        '<span class="meal-day-label">' + dayLabel(dayKey) + '</span>' +
      '</div>';

    var cards = state.members.map(function(m){
      var isMe = m.id === state.currentUser.id;
      var canEdit = isMe && isTodaySelected;
      var slots = MEAL_SLOTS.map(function(s){
        var meal = map[m.id + "|" + s.key];
        var cell;
        if (meal && meal.kind === "text"){
          cell = '<div class="meal-slot-text" title="' + escapeHtml(meal.text || "") + '">' + escapeHtml(meal.text || "") + '</div>';
        } else if (meal){
          cell = '<img class="meal-slot-photo" src="' + meal.photo + '" alt="' + escapeHtml(m.name) + ' ' + s.label + ' 인증 사진" data-lightbox="1" />';
        } else if (canEdit){
          cell = '<div class="meal-slot-empty" data-meal-slot="' + s.key + '" role="button" aria-label="' + s.label + ' 추가">+</div>';
        } else {
          cell = '<div class="meal-slot-empty locked">·</div>';
        }
        return '<div class="meal-slot">' + cell + '<span class="meal-slot-label">' + s.emoji + ' ' + s.label + '</span></div>';
      }).join("");

      var entryId = m.id + "_" + dayKey;
      var cardComments = state.mealComments.filter(function(c){ return c.entryId === entryId; });
      var commentListHtml = cardComments.length
        ? cardComments.map(function(c){
            return '<div class="comment-item"><span class="comment-author">' + escapeHtml(c.authorName) + '</span><span class="comment-text">' + escapeHtml(c.text) + '</span></div>';
          }).join("")
        : '<div class="comment-empty">댓글을 남겨보세요</div>';
      var draft = state.commentDrafts[entryId] || "";
      var commentForm = '' +
        '<div class="comment-form">' +
          '<input type="text" class="comment-input" data-comment-input="' + escapeHtml(entryId) + '" placeholder="댓글 남기기" value="' + escapeHtml(draft) + '" maxlength="80" />' +
          '<button class="comment-submit" data-comment-submit="' + escapeHtml(entryId) + '" aria-label="댓글 등록">➤</button>' +
        '</div>';

      return '' +
        '<div class="meal-card">' +
          '<div class="meal-member-name">' + escapeHtml(m.name) + (isMe ? '<span class="you-tag">나</span>' : '') + '</div>' +
          '<div class="meal-slots">' + slots + '</div>' +
          '<div class="comment-list">' + commentListHtml + '</div>' +
          commentForm +
        '</div>';
    }).join("");

    return backBar + cards;
  }

  function renderFeed(){
    if (!state.checkins.length){
      return '<div class="empty">아직 인증 사진이 없어요.<br/>첫 인증의 주인공이 되어보세요!</div>';
    }
    // state.checkins is already newest-first, so grouping in order keeps days newest-first too.
    var order = [];
    var groups = {};
    state.checkins.forEach(function(c){
      var key = dayKeyOf(c.createdAt);
      if (!groups[key]){ groups[key] = []; order.push(key); }
      groups[key].push(c);
    });
    return order.map(function(key){
      var cards = groups[key].map(function(c){
        return '' +
          '<div class="feed-item">' +
            '<img class="feed-photo" src="' + c.photo + '" alt="' + escapeHtml(c.name) + '님의 운동 인증 사진" data-lightbox="' + c.id + '" />' +
            '<div class="feed-caption"><span class="feed-name">' + escapeHtml(c.name) + '</span><span class="feed-time">' + timeOfDay(c.createdAt) + '</span></div>' +
          '</div>';
      }).join("");
      return '<div class="feed-day"><div class="feed-day-label">' + dayLabel(key) + '</div><div class="feed-grid">' + cards + '</div></div>';
    }).join("");
  }

  function bindMain(){
    var switchBtn = document.getElementById("switchBtn");
    if (switchBtn) switchBtn.addEventListener("click", function(){
      if (confirm("다른 사람으로 전환할까요? (내 기록은 그대로 남아요)")) handleSwitchIdentity();
    });

    var fileInput = document.getElementById("fileInput");
    var checkinBtn = document.getElementById("checkinBtn");
    if (checkinBtn) checkinBtn.addEventListener("click", function(){ fileInput.click(); });
    if (fileInput) fileInput.addEventListener("change", function(){
      var file = fileInput.files && fileInput.files[0];
      handleFileChosen(file);
      fileInput.value = "";
    });

    var mealFileInput = document.getElementById("mealFileInput");
    if (mealFileInput) mealFileInput.addEventListener("change", function(){
      var file = mealFileInput.files && mealFileInput.files[0];
      handleMealFileChosen(file);
      mealFileInput.value = "";
    });
    document.querySelectorAll("[data-meal-slot]").forEach(function(cell){
      cell.addEventListener("click", function(){
        openMealChoice(cell.getAttribute("data-meal-slot"));
      });
    });
    var mealChoicePhotoBtn = document.getElementById("mealChoicePhotoBtn");
    if (mealChoicePhotoBtn) mealChoicePhotoBtn.addEventListener("click", function(){
      var slot = state.pendingMealChoice && state.pendingMealChoice.slot;
      state.pendingMealChoice = null;
      state.pendingMealSlot = slot;
      render();
      var freshMealFileInput = document.getElementById("mealFileInput");
      if (freshMealFileInput) freshMealFileInput.click();
    });
    var mealChoiceTextBtn = document.getElementById("mealChoiceTextBtn");
    if (mealChoiceTextBtn) mealChoiceTextBtn.addEventListener("click", chooseMealText);
    var mealChoiceCancelBtn = document.getElementById("mealChoiceCancelBtn");
    if (mealChoiceCancelBtn) mealChoiceCancelBtn.addEventListener("click", cancelMealChoice);

    var mealTextInput = document.getElementById("mealTextInput");
    if (mealTextInput){
      mealTextInput.addEventListener("input", function(){
        if (state.pendingMealText) state.pendingMealText.text = mealTextInput.value;
      });
    }
    var mealTextCancelBtn = document.getElementById("mealTextCancelBtn");
    if (mealTextCancelBtn) mealTextCancelBtn.addEventListener("click", cancelMealText);
    var mealTextConfirmBtn = document.getElementById("mealTextConfirmBtn");
    if (mealTextConfirmBtn) mealTextConfirmBtn.addEventListener("click", confirmMealText);
    document.querySelectorAll("[data-meal-day]").forEach(function(cell){
      cell.addEventListener("click", function(){
        state.mealSelectedDay = cell.getAttribute("data-meal-day");
        render();
      });
    });
    var mealBackBtn = document.querySelector("[data-meal-back]");
    if (mealBackBtn) mealBackBtn.addEventListener("click", function(){
      state.mealSelectedDay = null;
      render();
    });
    var mealCalPrev = document.querySelector("[data-meal-cal-prev]");
    if (mealCalPrev) mealCalPrev.addEventListener("click", function(){
      state.mealCalendarMonth = shiftMonthKey(state.mealCalendarMonth, -1);
      render();
    });
    var mealCalNext = document.querySelector("[data-meal-cal-next]");
    if (mealCalNext) mealCalNext.addEventListener("click", function(){
      state.mealCalendarMonth = shiftMonthKey(state.mealCalendarMonth, 1);
      render();
    });
    var mealCancelBtn = document.getElementById("mealCancelBtn");
    if (mealCancelBtn) mealCancelBtn.addEventListener("click", cancelMealCheckin);
    var mealConfirmBtn = document.getElementById("mealConfirmBtn");
    if (mealConfirmBtn) mealConfirmBtn.addEventListener("click", confirmMealCheckin);

    document.querySelectorAll("[data-tab]").forEach(function(btn){
      btn.addEventListener("click", function(){ state.tab = btn.getAttribute("data-tab"); render(); });
    });

    var cancelBtn = document.getElementById("cancelCheckin");
    if (cancelBtn) cancelBtn.addEventListener("click", cancelCheckin);
    var confirmBtn = document.getElementById("confirmCheckin");
    if (confirmBtn) confirmBtn.addEventListener("click", confirmCheckin);

    document.querySelectorAll("[data-lightbox]").forEach(function(img){
      img.addEventListener("click", function(){ state.lightbox = img.getAttribute("src"); render(); });
    });
    var lbClose = document.getElementById("lightboxClose");
    if (lbClose) lbClose.addEventListener("click", function(){ state.lightbox = null; render(); });
    var lbOverlay = document.getElementById("lightboxOverlay");
    if (lbOverlay) lbOverlay.addEventListener("click", function(e){ if (e.target === lbOverlay){ state.lightbox = null; render(); } });

    document.querySelectorAll("[data-comment-input]").forEach(function(input){
      var entryId = input.getAttribute("data-comment-input");
      input.addEventListener("input", function(){ state.commentDrafts[entryId] = input.value; });
      input.addEventListener("keydown", function(e){ if (e.key === "Enter") submitComment(entryId); });
    });
    document.querySelectorAll("[data-comment-submit]").forEach(function(btn){
      var entryId = btn.getAttribute("data-comment-submit");
      btn.addEventListener("click", function(){ submitComment(entryId); });
    });

    var cleanupBtn = document.getElementById("cleanupBtn");
    if (cleanupBtn) cleanupBtn.addEventListener("click", openCleanup);
    var cleanupDateInput = document.getElementById("cleanupDateInput");
    if (cleanupDateInput) cleanupDateInput.addEventListener("change", function(){
      state.cleanup.date = cleanupDateInput.value;
      render();
    });
    var cleanupCancel = document.getElementById("cleanupCancel");
    if (cleanupCancel) cleanupCancel.addEventListener("click", closeCleanup);
    var cleanupConfirm = document.getElementById("cleanupConfirm");
    if (cleanupConfirm) cleanupConfirm.addEventListener("click", runCleanup);

    document.querySelectorAll("[data-member-row]").forEach(function(row){
      var memberId = row.getAttribute("data-member-row");
      var memberName = row.getAttribute("data-member-name");
      bindLongPress(row, function(){ requestDeleteMember(memberId, memberName); });
    });
    var deleteMemberCancel = document.getElementById("deleteMemberCancel");
    if (deleteMemberCancel) deleteMemberCancel.addEventListener("click", cancelDeleteMember);
    var deleteMemberConfirm = document.getElementById("deleteMemberConfirm");
    if (deleteMemberConfirm) deleteMemberConfirm.addEventListener("click", confirmDeleteMember);
  }

  /* ---------------- boot ---------------- */

  document.getElementById("app").innerHTML = '<div class="onboard"><div class="onboard-hero"><div class="eyebrow">Family Gym Log</div><h1>불러오는 중…</h1></div></div>';

  initDataLayer().then(function(dl){
    state.dataLayer = dl;
  });
})();
</script>
</body>
